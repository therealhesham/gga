<style>
.draw{stroke-dasharray:1;animation:draw 2.8s cubic-bezier(.3,.6,.2,1) backwards}
.fade{animation:rise 2s ease backwards}
.glow{animation:pulse 3.2s ease-in-out infinite}
.tw{animation:tw 5s ease-in-out infinite}
.sway{transform-origin:760px 112px;animation:sway 8s ease-in-out infinite}
.cable{transform-origin:760px 112px;animation:cable 16s ease-in-out infinite alternate}
.load{animation:load 16s ease-in-out infinite alternate}
@keyframes draw{from{stroke-dashoffset:1}}
@keyframes rise{from{opacity:0}}
@keyframes pulse{50%{opacity:.25}}
@keyframes tw{50%{opacity:.1}}
@keyframes sway{50%{transform:rotate(1.6deg)}0%,100%{transform:rotate(-1.6deg)}}
@keyframes cable{to{transform:scaleY(1.34)}}
@keyframes load{to{transform:translateY(40px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
